    <text x="685" y="910" font-family="Outfit, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">142</text>

    <rect x="830" y="850" width="230" height="90" fill="#111113" stroke="#333" stroke-width="1" rx="6"/>
    <text x="945" y="880" font-family="Inter, sans-serif" font-size="11" fill="#888" text-anchor="middle">XP Earned</text>
    <text x="945" y="910" font-family="Outfit, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">+80</text>

