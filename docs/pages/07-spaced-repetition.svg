    <text x="540" y="995" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#22C55E" text-anchor="middle">🎉 Keep going! 20 cards remaining</text>
    <rect x="420" y="1005" width="240" height="40" fill="#22C55E" rx="6"/>
    <text x="540" y="1030" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#0A0A0B" text-anchor="middle">Continue Review</text>
  

