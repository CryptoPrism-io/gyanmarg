<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1254" width="1080" height="1254">
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1254" fill="#0A0A0B"/>


    <rect x="0" y="0" width="1080" height="1080" fill="#1A1A1D" stroke="#F59E0B" stroke-width="3" rx="12"/>
    <rect x="0" y="0" width="1080" height="60" fill="#F59E0B" rx="12"/>
    <text x="540" y="38" font-family="Outfit, sans-serif" font-size="24" font-weight="700" fill="#0A0A0B" text-anchor="middle">SETTINGS</text>
    <text x="20" y="90" font-family="Inter, sans-serif" font-size="14" fill="#888">Route: /settings</text>

    <!-- Profile Section -->
    <text x="20" y="130" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">👤 Profile</text>

    <rect x="20" y="145" width="1040" height="120" fill="#111113" stroke="#F59E0B" stroke-width="2" rx="8"/>
    <circle cx="80" cy="205" r="35" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="2"/>
    <text x="80" y="215" font-family="Outfit, sans-serif" font-size="24" font-weight="700" fill="#F59E0B" text-anchor="middle">JD</text>
    <text x="140" y="195" font-family="Outfit, sans-serif" font-size="16" font-weight="600" fill="#E5E5E5">John Doe</text>
    <text x="140" y="218" font-family="Inter, sans-serif" font-size="11" fill="#888">john.doe@email.com</text>
    <text x="140" y="238" font-family="Inter, sans-serif" font-size="10" fill="#666">Member since Jan 2026 • Level 7 • 3,250 XP</text>
    <rect x="900" y="185" width="140" height="40" fill="#111113" stroke="#F59E0B" stroke-width="1" rx="6"/>
    <text x="970" y="210" font-family="Inter, sans-serif" font-size="12" fill="#F59E0B" text-anchor="middle">Edit Profile</text>

    <!-- Cloud Sync -->
    <text x="20" y="305" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">☁️ Cloud Sync</text>

    <rect x="20" y="320" width="1040" height="140" fill="#111113" stroke="#F59E0B" stroke-width="2" rx="8"/>
    <text x="40" y="350" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Backup your progress across devices</text>
    <text x="40" y="370" font-family="Inter, sans-serif" font-size="10" fill="#888">Last synced: 2 hours ago</text>
    <rect x="40" y="390" width="200" height="50" fill="none" stroke="#F59E0B" stroke-width="2" rx="6"/>
    <text x="80" y="415" font-family="Inter, sans-serif" font-size="16" fill="#F59E0B">🔑</text>
    <text x="110" y="420" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">Sign in with Google</text>
    <rect x="260" y="390" width="140" height="50" fill="#F59E0B" rx="6"/>
    <text x="330" y="420" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0A0A0B" text-anchor="middle">Sync Now</text>

    <!-- Data Management -->
    <text x="20" y="500" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">💾 Data Management</text>

    <rect x="20" y="515" width="1040" height="100" fill="#111113" stroke="#333" stroke-width="1" rx="8"/>
    <text x="40" y="545" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Export your learning data</text>
    <text x="40" y="565" font-family="Inter, sans-serif" font-size="10" fill="#888">Download all progress, saved cards, and settings as JSON</text>
    <rect x="40" y="580" width="160" height="35" fill="#111113" stroke="#F59E0B" stroke-width="1" rx="6"/>
    <text x="120" y="603" font-family="Inter, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle">Export Data</text>
    <rect x="220" y="580" width="160" height="35" fill="#111113" stroke="#F59E0B" stroke-width="1" rx="6"/>
    <text x="300" y="603" font-family="Inter, sans-serif" font-size="11" fill="#F59E0B" text-anchor="middle">Import Data</text>

    <!-- Preferences -->
    <text x="20" y="655" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#F59E0B">⚙️ Preferences</text>

    <rect x="20" y="670" width="1040" height="60" fill="#111113" stroke="#333" stroke-width="1" rx="8"/>
    <text x="40" y="700" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Audio Effects</text>
    <text x="40" y="718" font-family="Inter, sans-serif" font-size="10" fill="#888">Play sounds for XP rewards and achievements</text>
    <rect x="960" y="690" width="80" height="30" fill="#F59E0B" rx="15"/>
    <circle cx="1020" cy="705" r="12" fill="#0A0A0B"/>

    <rect x="20" y="745" width="1040" height="60" fill="#111113" stroke="#333" stroke-width="1" rx="8"/>
    <text x="40" y="775" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Daily Reminders</text>
    <text x="40" y="793" font-family="Inter, sans-serif" font-size="10" fill="#888">Get notified to complete your daily learning</text>
    <rect x="960" y="765" width="80" height="30" fill="#333" rx="15"/>
    <circle cx="980" cy="780" r="12" fill="#888"/>

    <rect x="20" y="820" width="1040" height="60" fill="#111113" stroke="#333" stroke-width="1" rx="8"/>
    <text x="40" y="850" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Dark Mode</text>
    <text x="40" y="868" font-family="Inter, sans-serif" font-size="10" fill="#888">Always enabled • Optimized for focus</text>
    <rect x="960" y="840" width="80" height="30" fill="#F59E0B" rx="15"/>
    <circle cx="1020" cy="855" r="12" fill="#0A0A0B"/>

    <!-- Danger Zone -->
    <text x="20" y="920" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#EF4444">⚠️ Danger Zone</text>

    <rect x="20" y="935" width="1040" height="60" fill="#111113" stroke="#EF4444" stroke-width="1" rx="8"/>
    <text x="40" y="965" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Reset All Progress</text>
    <text x="40" y="983" font-family="Inter, sans-serif" font-size="10" fill="#888">This will delete all your learning data permanently</text>
    <rect x="880" y="950" width="160" height="35" fill="none" stroke="#EF4444" stroke-width="2" rx="6"/>
    <text x="960" y="973" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#EF4444" text-anchor="middle">Reset Progress</text>

    <rect x="20" y="1010" width="1040" height="60" fill="#111113" stroke="#EF4444" stroke-width="1" rx="8"/>
    <text x="40" y="1040" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Delete Account</text>
    <text x="40" y="1058" font-family="Inter, sans-serif" font-size="10" fill="#888">Permanently delete your account and all associated data</text>
    <rect x="880" y="1025" width="160" height="35" fill="#EF4444" rx="6"/>
    <text x="960" y="1048" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A0A0B" text-anchor="middle">Delete Account</text>
  

  <!-- Navigation Flow -->
  <rect x="20" y="1100" width="1040" height="134" fill="#111113" stroke="#333" stroke-width="1" rx="6"/>
  <text x="540" y="1130" font-family="Outfit, sans-serif" font-size="13" font-weight="600" fill="#F59E0B" text-anchor="middle">🔀 Navigation Flow</text>

  <!-- Entry Points -->
  <text x="40" y="1155" font-family="Outfit, sans-serif" font-size="11" font-weight="600" fill="#E5E5E5">Ways to reach this page (2):</text>
  <text x="60" y="1175" font-family="Inter, sans-serif" font-size="10" fill="#888">• Navbar: Settings</text>
  <text x="60" y="1193" font-family="Inter, sans-serif" font-size="10" fill="#888">• Avatar dropdown menu</text>
  <text x="560" y="1155" font-family="Outfit, sans-serif" font-size="11" font-weight="600" fill="#E5E5E5">Where you can go (3):</text>
  <text x="580" y="1175" font-family="Inter, sans-serif" font-size="10" fill="#888">→ Dashboard</text>
  <text x="580" y="1193" font-family="Inter, sans-serif" font-size="10" fill="#888">→ Sign out</text>
  <text x="580" y="1211" font-family="Inter, sans-serif" font-size="10" fill="#888">→ Export/Import data</text>
</svg>
