    <circle cx="1020" cy="1035" r="14" fill="#22C55E"/>
    <text x="1020" y="1040" font-family="Inter, sans-serif" font-size="12" font-weight="700" fill="#0A0A0B" text-anchor="middle">✓</text>
  

