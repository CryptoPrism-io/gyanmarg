    <rect x="20" y="1005" width="1040" height="60" fill="#22C55E" fill-opacity="0.1" stroke="#22C55E" stroke-width="1" rx="6"/>
    <text x="40" y="1032" font-family="Inter, sans-serif" font-size="12" fill="#E5E5E5">Explain Spaced Repetition</text>
