    <text x="40" y="300" font-family="Inter, sans-serif" font-size="12" fill="#888">How to maximize retention and understanding</text>

    <!-- Content Body (markdown simulation) -->
    <text x="40" y="340" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#E5E5E5">What You'll Learn</text>
    <text x="55" y="365" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">• The science of optimal learning conditions</text>
    <text x="55" y="385" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">• How to structure your study sessions</text>
    <text x="55" y="405" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">• Techniques for faster comprehension</text>
    <text x="55" y="425" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">• Memory consolidation strategies</text>

    <text x="40" y="465" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#E5E5E5">Key Concepts</text>
    <rect x="40" y="475" width="730" height="100" fill="#0A0A0B" stroke="#F59E0B" stroke-width="1" rx="4"/>
    <text x="60" y="505" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#F59E0B">🎯 Optimal Learning Zone</text>
    <text x="60" y="525" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">The sweet spot between boredom and anxiety where</text>
    <text x="60" y="542" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">learning is most effective. Challenge + 15% is ideal.</text>
    <text x="60" y="562" font-family="Inter, sans-serif" font-size="10" fill="#888">→ Learn more about flow states in Level 3</text>

    <text x="40" y="605" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#E5E5E5">The 5-Step Framework</text>
    <text x="55" y="630" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">1. <tspan font-weight="600">Prime</tspan> - Review what you know (2 min)</text>
    <text x="55" y="650" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">2. <tspan font-weight="600">Engage</tspan> - Active learning (25 min)</text>
    <text x="55" y="670" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">3. <tspan font-weight="600">Test</tspan> - Self-quiz (5 min)</text>
    <text x="55" y="690" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">4. <tspan font-weight="600">Reflect</tspan> - Connect to existing knowledge (3 min)</text>
    <text x="55" y="710" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">5. <tspan font-weight="600">Apply</tspan> - Use it immediately (5 min)</text>

    <text x="40" y="750" font-family="Outfit, sans-serif" font-size="14" font-weight="600" fill="#E5E5E5">Research Backing</text>
    <text x="55" y="775" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">Studies show that optimized learning can improve</text>
    <text x="55" y="792" font-family="Inter, sans-serif" font-size="11" fill="#E5E5E5">retention by up to 400% compared to passive reading.</text>
    <text x="55" y="815" font-family="Inter, sans-serif" font-size="10" fill="#666">Source: Cognitive Psychology Journal, 2023</text>

