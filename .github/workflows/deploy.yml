name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - 'firebase.json'
      - 'firestore.rules'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  PROJECT_ID: social-data-pipeline-and-push
  HOSTING_TARGET: ai-polymind

jobs:
  deploy-firebase:
    name: Deploy to Firebase Hosting
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Keyless WIF. Reuses the pool that already exists in this GCP project
      # (projects/963362833537/.../workloadIdentityPools/github) — no key file.
      # google-github-actions/auth writes ADC, which firebase-tools picks up.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./app
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save 2>/dev/null || true

      - name: Build
        working-directory: ./app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting:${{ env.HOSTING_TARGET }} --project ${{ env.PROJECT_ID }}

      - name: Show deployment URL
        run: echo "Deployed to https://${{ env.HOSTING_TARGET }}.web.app"
