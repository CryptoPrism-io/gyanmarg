name: Deploy

# Everything is served from S3 + CloudFront (https://d38xyhaonwcjz3.cloudfront.net),
# which is now the canonical origin. Firebase Hosting (ai-polymind.web.app) is no
# longer deployed; Firebase is used for Google sign-in only. User data goes to the
# Polymind API (DynamoDB) - see infra/polymind-api.
#
# Step order is load-bearing: hashed assets go up FIRST, then the HTML and other
# un-hashed files that reference them. Reversing it publishes an index.html whose
# assets 404 until the sync catches up.

on:
  push:
    branches:
      - master
    paths:
      - 'app/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  S3_BUCKET: gyanmarg-prod
  CLOUDFRONT_DISTRIBUTION_ID: E1XLQPBNNEVOB8
  ASSET_BASE: https://d38xyhaonwcjz3.cloudfront.net/
  # Public Lambda Function URL (not a secret). Stack: polymind-api.
  POLYMIND_API_URL: https://dqr544m5uud7tam2f4kawetwsu0xguno.lambda-url.us-east-1.on.aws

jobs:
  deploy:
    name: Build and deploy to S3 + CloudFront
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: ./app
        run: |
          npm ci
          npm install @rollup/rollup-linux-x64-gnu --no-save 2>/dev/null || true

      - name: Build
        working-directory: ./app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VITE_ASSET_BASE: ${{ env.ASSET_BASE }}
          VITE_POLYMIND_API_URL: ${{ env.POLYMIND_API_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: npm run build

      - name: Fail if index.html does not reference CloudFront
        working-directory: ./app
        run: |
          if ! grep -q "${ASSET_BASE}assets/" dist/index.html; then
            echo "::error::Build did not rewrite asset URLs to ${ASSET_BASE}."
            grep -o 'src="[^"]*"' dist/index.html | head
            exit 1
          fi
          echo "Asset URLs correctly point at ${ASSET_BASE}"

      # --- 1. Assets first ---------------------------------------------------
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::405633560616:role/gha-gyanmarg-deploy
          aws-region: ${{ env.AWS_REGION }}

      # Additive on purpose - no --delete. Pruning here would remove the assets a
      # still-cached index.html is asking for. Stale objects are cents; a broken page is not.
      - name: Sync hashed assets (long cache)
        working-directory: ./app
        run: |
          aws s3 sync dist/assets "s3://${S3_BUCKET}/assets"             --cache-control "public,max-age=31536000,immutable"

      # Un-hashed files (index.html, sw.js, manifest.json, icons, robots, sitemap...)
      # must revalidate so a new release (and a new service worker) is picked up.
      - name: Sync HTML and public files (revalidate)
        working-directory: ./app
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/"             --exclude "assets/*" --exclude "*.html"             --cache-control "public,max-age=0,must-revalidate"
          aws s3 sync dist/ "s3://${S3_BUCKET}/"             --exclude "*" --include "*.html"             --content-type "text/html; charset=utf-8"             --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront (everything but hashed assets)
        run: |
          aws cloudfront create-invalidation             --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}"             --paths "/" "/index.html" "/sw.js" "/manifest.json" "/*.html" "/*.txt" "/*.xml" "/icons/*"

      - name: Show deployment URL
        run: echo "Deployed to ${ASSET_BASE}"
