<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Premium gold gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Subtle inner gradient -->
    <radialGradient id="centerLight" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer ring - represents infinite knowledge -->
  <circle
    cx="256" cy="256" r="200"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="4"
    opacity="0.3"
  />

  <!-- Middle ring -->
  <circle
    cx="256" cy="256" r="160"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="3"
    opacity="0.5"
  />

  <!-- Inner filled circle with gradient -->
  <circle
    cx="256" cy="256" r="120"
    fill="#0A0A0B"
    stroke="url(#goldGrad)"
    stroke-width="4"
    filter="url(#softShadow)"
  />

  <!-- Inner light effect -->
  <circle cx="256" cy="256" r="118" fill="url(#centerLight)"/>

  <!-- Stylized P made of connected nodes -->
  <g filter="url(#glow)">
    <!-- P stem -->
    <line x1="200" y1="320" x2="200" y2="192" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- P bowl - arc -->
    <path
      d="M 200 192 Q 200 168 224 168 L 280 168 Q 320 168 320 208 Q 320 248 280 248 L 200 248"
      fill="none"
      stroke="url(#goldGrad)"
      stroke-width="8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Knowledge nodes on the P -->
  <g filter="url(#glow)">
    <!-- Top of stem -->
    <circle cx="200" cy="192" r="10" fill="#FDE68A"/>
    <!-- Bottom of stem -->
    <circle cx="200" cy="320" r="10" fill="#F59E0B"/>
    <!-- Bowl top -->
    <circle cx="280" cy="168" r="8" fill="#FCD34D"/>
    <!-- Bowl right -->
    <circle cx="320" cy="208" r="8" fill="#FCD34D"/>
    <!-- Bowl bottom connection -->
    <circle cx="200" cy="248" r="8" fill="#F59E0B"/>
  </g>

  <!-- Orbiting knowledge dots -->
  <g opacity="0.7">
    <circle cx="256" cy="76" r="6" fill="#F59E0B"/>
    <circle cx="412" cy="168" r="5" fill="#FCD34D"/>
    <circle cx="436" cy="256" r="4" fill="#F59E0B"/>
    <circle cx="412" cy="344" r="5" fill="#FCD34D"/>
    <circle cx="256" cy="436" r="6" fill="#F59E0B"/>
    <circle cx="100" cy="344" r="5" fill="#FCD34D"/>
    <circle cx="76" cy="256" r="4" fill="#F59E0B"/>
    <circle cx="100" cy="168" r="5" fill="#FCD34D"/>
  </g>

  <!-- Connecting lines to orbiting dots (subtle) -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.2">
    <line x1="256" y1="136" x2="256" y2="76"/>
    <line x1="376" y1="256" x2="436" y2="256"/>
    <line x1="256" y1="376" x2="256" y2="436"/>
    <line x1="136" y1="256" x2="76" y2="256"/>
  </g>
</svg>
