<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradient for the prism glow -->
    <linearGradient id="prismGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#D97706" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Gradient for inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradient for knowledge nodes -->
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- Filter for outer glow effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filter for node glow -->
    <filter id="nodeGlowFilter" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip path for hexagon -->
    <clipPath id="hexClip">
      <polygon points="256,40 450,148 450,364 256,472 62,364 62,148"/>
    </clipPath>
  </defs>

  <!-- Background glow -->
  <ellipse cx="256" cy="256" rx="180" ry="180" fill="url(#innerGlow)" opacity="0.5"/>

  <!-- Main hexagonal prism - outer edge -->
  <polygon
    points="256,52 438,154 438,358 256,460 74,358 74,154"
    fill="none"
    stroke="url(#prismGlow)"
    stroke-width="3"
    filter="url(#glow)"
    opacity="0.9"
  />

  <!-- Inner hexagon layer 1 -->
  <polygon
    points="256,90 400,175 400,337 256,422 112,337 112,175"
    fill="none"
    stroke="#F59E0B"
    stroke-width="1.5"
    opacity="0.4"
  />

  <!-- Inner hexagon layer 2 -->
  <polygon
    points="256,130 360,195 360,317 256,382 152,317 152,195"
    fill="none"
    stroke="#F59E0B"
    stroke-width="1"
    opacity="0.3"
  />

  <!-- 3D prism depth lines -->
  <line x1="256" y1="52" x2="256" y2="130" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="438" y1="154" x2="360" y2="195" stroke="#FCD34D" stroke-width="1" opacity="0.4"/>
  <line x1="438" y1="358" x2="360" y2="317" stroke="#FCD34D" stroke-width="1" opacity="0.4"/>
  <line x1="256" y1="460" x2="256" y2="382" stroke="#FCD34D" stroke-width="1" opacity="0.5"/>
  <line x1="74" y1="358" x2="152" y2="317" stroke="#FCD34D" stroke-width="1" opacity="0.4"/>
  <line x1="74" y1="154" x2="152" y2="195" stroke="#FCD34D" stroke-width="1" opacity="0.4"/>

  <!-- Neural network pathways -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.6" filter="url(#glow)">
    <!-- Central connections -->
    <line x1="256" y1="256" x2="256" y2="160"/>
    <line x1="256" y1="256" x2="340" y2="205"/>
    <line x1="256" y1="256" x2="340" y2="307"/>
    <line x1="256" y1="256" x2="256" y2="352"/>
    <line x1="256" y1="256" x2="172" y2="307"/>
    <line x1="256" y1="256" x2="172" y2="205"/>

    <!-- Secondary pathways -->
    <line x1="256" y1="160" x2="340" y2="205" opacity="0.4"/>
    <line x1="340" y1="205" x2="340" y2="307" opacity="0.4"/>
    <line x1="340" y1="307" x2="256" y2="352" opacity="0.4"/>
    <line x1="256" y1="352" x2="172" y2="307" opacity="0.4"/>
    <line x1="172" y1="307" x2="172" y2="205" opacity="0.4"/>
    <line x1="172" y1="205" x2="256" y2="160" opacity="0.4"/>

    <!-- Outer connections -->
    <line x1="256" y1="160" x2="256" y2="100" opacity="0.3"/>
    <line x1="340" y1="205" x2="390" y2="175" opacity="0.3"/>
    <line x1="340" y1="307" x2="390" y2="337" opacity="0.3"/>
    <line x1="256" y1="352" x2="256" y2="410" opacity="0.3"/>
    <line x1="172" y1="307" x2="122" y2="337" opacity="0.3"/>
    <line x1="172" y1="205" x2="122" y2="175" opacity="0.3"/>
  </g>

  <!-- Knowledge nodes - central -->
  <circle cx="256" cy="256" r="16" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>

  <!-- Knowledge nodes - inner ring -->
  <circle cx="256" cy="160" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>
  <circle cx="340" cy="205" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>
  <circle cx="340" cy="307" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>
  <circle cx="256" cy="352" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>
  <circle cx="172" cy="307" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>
  <circle cx="172" cy="205" r="10" fill="url(#nodeGlow)" filter="url(#nodeGlowFilter)"/>

  <!-- Knowledge nodes - outer ring (smaller) -->
  <circle cx="256" cy="100" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>
  <circle cx="390" cy="175" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>
  <circle cx="390" cy="337" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>
  <circle cx="256" cy="410" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>
  <circle cx="122" cy="337" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>
  <circle cx="122" cy="175" r="6" fill="#FCD34D" opacity="0.7" filter="url(#nodeGlowFilter)"/>

  <!-- Corner accent nodes -->
  <circle cx="256" cy="60" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="430" cy="160" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="430" cy="352" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="256" cy="452" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="82" cy="352" r="4" fill="#F59E0B" opacity="0.5"/>
  <circle cx="82" cy="160" r="4" fill="#F59E0B" opacity="0.5"/>
</svg>
