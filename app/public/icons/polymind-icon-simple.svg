<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer hexagon -->
  <polygon
    points="64,8 116,34 116,94 64,120 12,94 12,34"
    fill="none"
    stroke="url(#hexGrad)"
    stroke-width="4"
    filter="url(#glow)"
  />

  <!-- Inner hexagon -->
  <polygon
    points="64,28 96,46 96,82 64,100 32,82 32,46"
    fill="none"
    stroke="#F59E0B"
    stroke-width="2"
    opacity="0.5"
  />

  <!-- Neural pathways -->
  <g stroke="#F59E0B" stroke-width="2" opacity="0.7">
    <line x1="64" y1="64" x2="64" y2="38"/>
    <line x1="64" y1="64" x2="86" y2="51"/>
    <line x1="64" y1="64" x2="86" y2="77"/>
    <line x1="64" y1="64" x2="64" y2="90"/>
    <line x1="64" y1="64" x2="42" y2="77"/>
    <line x1="64" y1="64" x2="42" y2="51"/>
  </g>

  <!-- Central node -->
  <circle cx="64" cy="64" r="8" fill="url(#centerGlow)" filter="url(#glow)"/>

  <!-- Outer nodes -->
  <circle cx="64" cy="38" r="5" fill="#FCD34D"/>
  <circle cx="86" cy="51" r="5" fill="#FCD34D"/>
  <circle cx="86" cy="77" r="5" fill="#FCD34D"/>
  <circle cx="64" cy="90" r="5" fill="#FCD34D"/>
  <circle cx="42" cy="77" r="5" fill="#FCD34D"/>
  <circle cx="42" cy="51" r="5" fill="#FCD34D"/>
</svg>
