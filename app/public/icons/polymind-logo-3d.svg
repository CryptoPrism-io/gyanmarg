<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main amber gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Glass reflection gradient -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#F59E0B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#78350F" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Dark face gradient (right side) -->
    <linearGradient id="darkFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#92400E" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#451A03" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Light face gradient (left side) -->
    <linearGradient id="lightFace" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#D97706" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Top face gradient -->
    <linearGradient id="topFace" x1="50%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FEF3C7" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Inner glow -->
    <radialGradient id="innerGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Core glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#FEF3C7" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Node gradient -->
    <radialGradient id="nodeGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </radialGradient>

    <!-- Inner shadow filter -->
    <filter id="innerShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feComponentTransfer in="SourceAlpha">
        <feFuncA type="table" tableValues="1 0"/>
      </feComponentTransfer>
      <feGaussianBlur stdDeviation="8"/>
      <feOffset dx="4" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.5"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode/>
      </feMerge>
    </filter>

    <!-- Outer glow filter -->
    <filter id="outerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feFlood flood-color="#F59E0B" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow for nodes -->
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Line glow -->
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep shadow -->
    <filter id="deepShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="15" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient glow behind everything -->
  <ellipse cx="256" cy="280" rx="160" ry="100" fill="#F59E0B" opacity="0.15" filter="url(#outerGlow)"/>

  <!-- ==================== 3D HEXAGONAL PRISM ==================== -->

  <!-- Back face (bottom) - creates depth -->
  <polygon
    points="256,420 400,340 400,220 256,140 112,220 112,340"
    fill="#1C1917"
    opacity="0.8"
  />

  <!-- Left face of prism -->
  <polygon
    points="112,172 256,92 256,280 112,360"
    fill="url(#lightFace)"
    filter="url(#innerShadow)"
  />
  <polygon
    points="112,172 256,92 256,280 112,360"
    fill="none"
    stroke="#F59E0B"
    stroke-width="2"
    opacity="0.6"
  />

  <!-- Right face of prism -->
  <polygon
    points="400,172 256,92 256,280 400,360"
    fill="url(#darkFace)"
    filter="url(#innerShadow)"
  />
  <polygon
    points="400,172 256,92 256,280 400,360"
    fill="none"
    stroke="#B45309"
    stroke-width="2"
    opacity="0.4"
  />

  <!-- Bottom left face -->
  <polygon
    points="112,172 112,360 256,440 256,280"
    fill="url(#darkFace)"
    opacity="0.7"
  />
  <polygon
    points="112,172 112,360 256,440 256,280"
    fill="none"
    stroke="#92400E"
    stroke-width="1.5"
    opacity="0.5"
  />

  <!-- Bottom right face -->
  <polygon
    points="400,172 400,360 256,440 256,280"
    fill="#451A03"
    opacity="0.6"
  />
  <polygon
    points="400,172 400,360 256,440 256,280"
    fill="none"
    stroke="#78350F"
    stroke-width="1.5"
    opacity="0.4"
  />

  <!-- Top face of prism (hexagon) -->
  <polygon
    points="256,92 400,172 400,172 256,252 112,172"
    fill="url(#topFace)"
  />
  <polygon
    points="256,92 400,172 256,252 112,172"
    fill="url(#glassReflect)"
  />
  <polygon
    points="256,92 400,172 256,252 112,172"
    fill="none"
    stroke="url(#amberGrad)"
    stroke-width="3"
    filter="url(#outerGlow)"
  />

  <!-- Inner glow effect -->
  <ellipse cx="256" cy="200" rx="120" ry="70" fill="url(#innerGlow)"/>

  <!-- ==================== INNER CRYSTAL STRUCTURE ==================== -->

  <!-- Inner hexagon layer 1 -->
  <polygon
    points="256,120 360,175 360,285 256,340 152,285 152,175"
    fill="none"
    stroke="#F59E0B"
    stroke-width="1"
    opacity="0.3"
  />

  <!-- Inner hexagon layer 2 (core) -->
  <polygon
    points="256,160 320,195 320,265 256,300 192,265 192,195"
    fill="rgba(245,158,11,0.05)"
    stroke="#FCD34D"
    stroke-width="1.5"
    opacity="0.5"
  />

  <!-- Vertical depth lines -->
  <g stroke="#F59E0B" stroke-width="1" opacity="0.25">
    <line x1="256" y1="92" x2="256" y2="160"/>
    <line x1="400" y1="172" x2="320" y2="195"/>
    <line x1="112" y1="172" x2="192" y2="195"/>
    <line x1="400" y1="360" x2="320" y2="265"/>
    <line x1="112" y1="360" x2="192" y2="265"/>
    <line x1="256" y1="440" x2="256" y2="300"/>
  </g>

  <!-- ==================== NEURAL NETWORK ==================== -->

  <!-- Primary pathways from center -->
  <g stroke="#FCD34D" stroke-width="2" opacity="0.7" filter="url(#lineGlow)">
    <line x1="256" y1="230" x2="256" y2="170"/>
    <line x1="256" y1="230" x2="310" y2="200"/>
    <line x1="256" y1="230" x2="310" y2="260"/>
    <line x1="256" y1="230" x2="256" y2="290"/>
    <line x1="256" y1="230" x2="202" y2="260"/>
    <line x1="256" y1="230" x2="202" y2="200"/>
  </g>

  <!-- Secondary connections (hexagon edges) -->
  <g stroke="#F59E0B" stroke-width="1.5" opacity="0.4" filter="url(#lineGlow)">
    <line x1="256" y1="170" x2="310" y2="200"/>
    <line x1="310" y1="200" x2="310" y2="260"/>
    <line x1="310" y1="260" x2="256" y2="290"/>
    <line x1="256" y1="290" x2="202" y2="260"/>
    <line x1="202" y1="260" x2="202" y2="200"/>
    <line x1="202" y1="200" x2="256" y2="170"/>
  </g>

  <!-- Tertiary connections to outer shell -->
  <g stroke="#B45309" stroke-width="1" opacity="0.3">
    <line x1="256" y1="170" x2="256" y2="130"/>
    <line x1="310" y1="200" x2="350" y2="180"/>
    <line x1="310" y1="260" x2="350" y2="280"/>
    <line x1="256" y1="290" x2="256" y2="330"/>
    <line x1="202" y1="260" x2="162" y2="280"/>
    <line x1="202" y1="200" x2="162" y2="180"/>
  </g>

  <!-- ==================== KNOWLEDGE NODES ==================== -->

  <!-- Central core node (largest) -->
  <circle cx="256" cy="230" r="18" fill="url(#nodeGrad)" filter="url(#softGlow)"/>
  <circle cx="256" cy="230" r="10" fill="#FEF3C7" opacity="0.8"/>
  <circle cx="252" cy="226" r="4" fill="#FFFFFF" opacity="0.6"/>

  <!-- Primary nodes (inner ring) -->
  <g filter="url(#softGlow)">
    <circle cx="256" cy="170" r="12" fill="url(#nodeGrad)"/>
    <circle cx="254" cy="167" r="3" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="310" cy="200" r="12" fill="url(#nodeGrad)"/>
    <circle cx="308" cy="197" r="3" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="310" cy="260" r="12" fill="url(#nodeGrad)"/>
    <circle cx="308" cy="257" r="3" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="256" cy="290" r="12" fill="url(#nodeGrad)"/>
    <circle cx="254" cy="287" r="3" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="202" cy="260" r="12" fill="url(#nodeGrad)"/>
    <circle cx="200" cy="257" r="3" fill="#FFFFFF" opacity="0.5"/>

    <circle cx="202" cy="200" r="12" fill="url(#nodeGrad)"/>
    <circle cx="200" cy="197" r="3" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Secondary nodes (outer) -->
  <g opacity="0.8">
    <circle cx="256" cy="130" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
    <circle cx="350" cy="180" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
    <circle cx="350" cy="280" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
    <circle cx="256" cy="330" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
    <circle cx="162" cy="280" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
    <circle cx="162" cy="180" r="7" fill="#FCD34D" filter="url(#softGlow)"/>
  </g>

  <!-- Corner accent nodes -->
  <g opacity="0.5">
    <circle cx="256" cy="100" r="4" fill="#F59E0B"/>
    <circle cx="390" cy="175" r="4" fill="#F59E0B"/>
    <circle cx="390" cy="350" r="4" fill="#F59E0B"/>
    <circle cx="256" cy="430" r="4" fill="#F59E0B"/>
    <circle cx="122" cy="350" r="4" fill="#F59E0B"/>
    <circle cx="122" cy="175" r="4" fill="#F59E0B"/>
  </g>

  <!-- ==================== HIGHLIGHTS & REFLECTIONS ==================== -->

  <!-- Top edge highlight -->
  <line x1="130" y1="165" x2="220" y2="115" stroke="#FEF3C7" stroke-width="2" opacity="0.4" stroke-linecap="round"/>

  <!-- Glass reflection streak -->
  <line x1="150" y1="190" x2="200" y2="160" stroke="#FFFFFF" stroke-width="1" opacity="0.2" stroke-linecap="round"/>

</svg>
