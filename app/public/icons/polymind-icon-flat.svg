<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="#F59E0B">
  <!-- Outer hexagon -->
  <polygon
    points="32,4 58,17 58,47 32,60 6,47 6,17"
    fill="none"
    stroke="currentColor"
    stroke-width="3"
  />

  <!-- Neural pathways -->
  <line x1="32" y1="32" x2="32" y2="18" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="32" x2="44" y2="25" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="32" x2="44" y2="39" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="32" x2="32" y2="46" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="32" x2="20" y2="39" stroke="currentColor" stroke-width="2"/>
  <line x1="32" y1="32" x2="20" y2="25" stroke="currentColor" stroke-width="2"/>

  <!-- Central node -->
  <circle cx="32" cy="32" r="5" fill="currentColor"/>

  <!-- Outer nodes -->
  <circle cx="32" cy="18" r="3" fill="currentColor"/>
  <circle cx="44" cy="25" r="3" fill="currentColor"/>
  <circle cx="44" cy="39" r="3" fill="currentColor"/>
  <circle cx="32" cy="46" r="3" fill="currentColor"/>
  <circle cx="20" cy="39" r="3" fill="currentColor"/>
  <circle cx="20" cy="25" r="3" fill="currentColor"/>
</svg>
