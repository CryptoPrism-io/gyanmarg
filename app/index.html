    <!-- PWA Install Prompt Capture - MUST be first script to catch the event -->
    <script>
      window.deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwainstallready'));
      });
      window.addEventListener('appinstalled', function() {
        window.deferredInstallPrompt = null;
        window.dispatchEvent(new CustomEvent('pwainstalled'));
      });
      window.triggerPWAInstall = async function() {
        if (!window.deferredInstallPrompt) {
          return { success: false, reason: 'no-prompt' };
        }
        try {
          window.deferredInstallPrompt.prompt();
          const result = await window.deferredInstallPrompt.userChoice;
          if (result.outcome === 'accepted') {
            window.deferredInstallPrompt = null;
          }
          return { success: result.outcome === 'accepted', reason: result.outcome };
        } catch (err) {
          return { success: false, reason: 'error' };
        }
      };
      // Remove the loader once React mounts
      window.addEventListener('load', function() {
        requestAnimationFrame(function() {
          var loader = document.getElementById('app-loader');
          if (loader) {
            loader.classList.add('loader-fade');
            setTimeout(function() { if (loader.parentNode) loader.parentNode.removeChild(loader); }, 500);
          }
        });
      });
    </script>

    <!-- Inline loader styles — renders before any external CSS -->
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      #app-loader {
        position: fixed; inset: 0; z-index: 99999;
        background: #121110;
        display: flex; align-items: center; justify-content: center;
        transition: opacity 0.5s ease;
      }
      #app-loader.loader-fade { opacity: 0; pointer-events: none; }
      .loader-inner {
        text-align: center;
        display: flex; flex-direction: column; align-items: center; gap: 32px;
      }
      /* Orbital logo */
      .loader-logo { width: 96px; height: 96px; position: relative; }
      .loader-logo svg { width: 100%; height: 100%; }
      .orbital-ring { fill: none; stroke-width: 2; stroke-linecap: round; }
      .orbital-core { fill: #121110; stroke: #C5A368; stroke-width: 2.5; }
      .orbital-core-inner { fill: #FDE68A; }
      .orbital-core-inner.pulse { animation: corePulse 2s ease-in-out infinite; }
      @keyframes corePulse { 0%, 100% { r: 5; } 50% { r: 7; } }
      .electron { fill: #FCD34D; }
      .electron-2 { fill: #C5A368; }
      .brand-text {
        font-family: 'Outfit', -apple-system, system-ui, sans-serif;
        font-weight: 700; letter-spacing: 0.2em; font-size: 18px;
        color: #E6E1DF; opacity: 0.9;
      }
      .tagline {
        font-family: 'Inter', -apple-system, system-ui, sans-serif;
        font-size: 12px; color: #9A8F81; letter-spacing: 0.08em;
      }
      /* Progress bar */
      .loader-bar-track {
        width: 200px; height: 2px; border-radius: 1px;
        background: rgba(230,225,223,0.08); overflow: hidden;
      }
      .loader-bar-fill {
        height: 100%; border-radius: 1px;
        background: linear-gradient(90deg, #C5A368, #FDE68A);
        animation: loaderProgress 2.5s ease-in-out forwards;
        transform-origin: left;
      }
      @keyframes loaderProgress {
        0% { transform: scaleX(0); }
        40% { transform: scaleX(0.6); }
        70% { transform: scaleX(0.85); }
        100% { transform: scaleX(0.92); }
      }
      /* Loading dots */
      .loader-dots { display: flex; gap: 6px; align-items: center; }
      .loader-dot { width: 4px; height: 4px; border-radius: 50%; background: #C5A368; }
      .loader-dot:nth-child(1) { animation: dotBounce 1.2s ease-in-out infinite; }
      .loader-dot:nth-child(2) { animation: dotBounce 1.2s ease-in-out 0.2s infinite; }
      .loader-dot:nth-child(3) { animation: dotBounce 1.2s ease-in-out 0.4s infinite; }
      @keyframes dotBounce { 0%, 80%, 100% { opacity: 0.3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
    </style>
  </head>
